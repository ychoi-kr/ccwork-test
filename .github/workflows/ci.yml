name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # npm run lint는 --fix가 붙어 있어 CI에서 파일을 수정해 버리므로 검사만 한다.
      - name: Lint
        run: npx eslint .

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 보안 점검
        run: npm audit --audit-level=moderate

      - name: 단위 테스트
        run: npm test
